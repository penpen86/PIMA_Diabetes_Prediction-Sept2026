name: MLOps pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'PIMA_Diabetes_Prediction/model_building/**'
      - 'PIMA_Diabetes_Prediction/data/pima.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  data-prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Dependencies
        run: pip install -r PIMA_Diabetes_Prediction/deployment/requirements.txt
      - name: Run Data Preparation
        run: python PIMA_Diabetes_Prediction/model_building/prep.py
      - name: Commit and push processed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PIMA_Diabetes_Prediction/data/*.csv
          git diff --cached --quiet || git commit -m "Add train/test split data [skip ci]"
          git push

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Dependencies
        run: pip install -r PIMA_Diabetes_Prediction/deployment/requirements.txt
      - name: Model Building
        run: python PIMA_Diabetes_Prediction/model_building/train.py
      - name: Commit and push trained model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PIMA_Diabetes_Prediction/deployment/model/*.joblib
          git diff --cached --quiet || git commit -m "Add trained model [skip ci]"
          git push
